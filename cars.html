<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>إدارة العربيات</title>
  <link rel="stylesheet" href="./styles/base.css" />
  <link rel="stylesheet" href="./styles/cars.css" />
  <link rel="icon" href="./assets/GEM-Group-2024.ico" type="image/x-icon" />
  <script src="./scripts/utils.js" defer></script>
  <script src="./scripts/cars.js" defer></script>
  <script>
    function applyTheme(mode) {
      document.body.classList.toggle("dark-mode", mode === "dark");
    }

    window.addEventListener("message", (event) => {
      if (event.data && event.data.theme) {
        applyTheme(event.data.theme);
        localStorage.setItem("theme", event.data.theme);
      }
    });

    document.addEventListener("DOMContentLoaded", () => {
      applyTheme(localStorage.getItem("theme") || "light");
    });

    if (window.self === window.top) {
      const page = location.pathname.split("/").pop() || "cars.html";
      window.location.replace("index.html?page=" + encodeURIComponent(page));
    }
  </script>
</head>

<body>
  <h1 class="page-heading">إدارة العربيات</h1>

  <div class="tab-switch" role="tablist">
    <button type="button" class="tab-btn active" data-tab="cars">العربيات</button>
    <button type="button" class="tab-btn" data-tab="drivers">السواقين</button>
    <button type="button" class="tab-btn" data-tab="distributors">الموزعين</button>
  </div>

  <section id="tab-cars" class="tab-panel">
    <div class="fleet-toolbar">
      <div class="toolbar-field">
        <label for="car-search">البحث بنمر العربية / الماركة:</label>
        <input type="search" id="car-search" placeholder="اكتب نمر العربية أو الماركة..." />
      </div>

      <div class="toolbar-field toolbar-field--narrow">
        <label for="car-filter-assigned">الربط:</label>
        <select id="car-filter-assigned">
          <option value="">الكل</option>
          <option value="1">مربوط</option>
          <option value="0">مش مربوط</option>
        </select>
      </div>

      <div class="toolbar-field toolbar-field--narrow">
        <label for="car-filter-active">الحالة:</label>
        <select id="car-filter-active">
          <option value="1">شغالة</option>
          <option value="0">متوقفة</option>
          <option value="">الكل</option>
        </select>
      </div>

      <div class="toolbar-field toolbar-field--btn">
        <button id="add-car-btn" type="button">ضيف عربية</button>
      </div>
    </div>

    <div class="table-responsive">
      <table class="table">
        <thead>
          <tr>
            <th>نمر العربية</th>
            <th>الماركة / الموديل</th>
            <th>التفاصيل</th>
            <th>المنطقة</th>
            <th>السواق</th>
            <th>الموزع</th>
            <th>الإجراءات</th>
          </tr>
        </thead>
        <tbody id="cars-table-body"></tbody>
      </table>
    </div>

    <div class="card-view" style="display: none">
      <div id="car-cards"></div>
    </div>

    <p id="cars-empty" class="empty-state hidden">مفيش عربيات</p>
  </section>

  <section id="tab-drivers" class="tab-panel hidden">
    <div class="fleet-toolbar">
      <div class="toolbar-field">
        <label for="driver-search">البحث بالاسم / رقم التليفون:</label>
        <input type="search" id="driver-search" placeholder="اكتب الاسم أو رقم التليفون..." />
      </div>

      <div class="toolbar-field toolbar-field--narrow">
        <label for="driver-filter-active">الحالة:</label>
        <select id="driver-filter-active">
          <option value="">الكل</option>
          <option value="1">شغالة</option>
          <option value="0">متوقف</option>
        </select>
      </div>

      <div class="toolbar-field toolbar-field--btn">
        <button id="add-driver-btn" type="button">ضيف سواق</button>
      </div>
    </div>

    <div class="table-responsive">
      <table class="table">
        <thead>
          <tr>
            <th>اسم المستخدم</th>
            <th>رقم التليفون</th>
            <th>المنطقة</th>
            <th>العربية</th>
            <th>التوصيلات</th>
            <th>الحالة</th>
            <th>الإجراءات</th>
          </tr>
        </thead>
        <tbody id="drivers-table-body"></tbody>
      </table>
    </div>

    <div class="card-view" style="display: none">
      <div id="driver-cards"></div>
    </div>

    <p id="drivers-empty" class="empty-state hidden">مفيش سواقين</p>
  </section>

  <section id="tab-distributors" class="tab-panel hidden">
    <div class="fleet-toolbar">
      <div class="toolbar-field">
        <label for="distributor-search">البحث بالاسم / رقم التليفون:</label>
        <input type="search" id="distributor-search" placeholder="اكتب الاسم أو رقم التليفون..." />
      </div>
      <div class="toolbar-field toolbar-field--narrow">
        <label for="distributor-filter-active">الحالة:</label>
        <select id="distributor-filter-active">
          <option value="">الكل</option>
          <option value="1">شغال</option>
          <option value="0">متوقف</option>
        </select>
      </div>
      <div class="toolbar-field toolbar-field--btn">
        <button id="add-distributor-btn" type="button">ضيف موزع</button>
      </div>
    </div>
    <div class="table-responsive">
      <table class="table">
        <thead><tr>
          <th>اسم المستخدم</th><th>رقم التليفون</th><th>المنطقة</th>
          <th>العربية</th><th>الحالة</th><th>الإجراءات</th>
        </tr></thead>
        <tbody id="distributors-table-body"></tbody>
      </table>
    </div>
    <div class="card-view" style="display: none"><div id="distributor-cards"></div></div>
    <p id="distributors-empty" class="empty-state hidden">مفيش موزعين</p>
  </section>

  <div id="car-modal" class="modal hidden">
    <div class="modal-content">
      <h2 id="car-modal-title">ضيف عربية</h2>
      <form id="car-form">
        <input type="hidden" id="car-id" />

        <div class="form-group">
          <label for="car-plate">نمر العربية <span class="req">*</span></label>
          <input type="text" id="car-plate" required placeholder="مثال: ABC 1234" />
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="car-brand">الماركة</label>
            <input type="text" id="car-brand" placeholder="مثال: Toyota" />
          </div>
          <div class="form-group">
            <label for="car-model">الموديل</label>
            <input type="text" id="car-model" placeholder="مثال: Hiace" />
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="car-year">سنة الصنع</label>
            <input type="number" id="car-year" min="1950" max="2100" placeholder="مثال: 2022" />
          </div>
          <div class="form-group">
            <label for="car-region">المنطقة</label>
            <select id="car-region">
              <option value="cairo">القاهرة</option>
              <option value="alex">اسكندرية</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="car-notes">ملاحظات</label>
          <textarea id="car-notes" rows="2" placeholder="أي ملاحظات مهمة عن العربية"></textarea>
        </div>

        <div class="modal-actions">
          <button type="submit" class="btn btn-primary">حفظ</button>
          <button type="button" class="btn cancel-btn" data-close="car-modal">إلغاء</button>
        </div>
      </form>
    </div>
  </div>

  <div id="assign-modal" class="modal hidden">
    <div class="modal-content">
      <h2 id="assign-modal-title">ربط العربية</h2>
      <p class="modal-sub" id="assign-car-label"></p>
      <form id="assign-form">
        <input type="hidden" id="assign-car-id" />
        <div class="form-group">
          <label for="assign-driver" id="assign-person-label">السواق</label>
          <select id="assign-driver" required>
            <option value="">اختار السواق...</option>
          </select>
        </div>
        <div class="modal-actions">
          <button type="submit" class="btn btn-primary">ربط</button>
          <button type="button" class="btn cancel-btn" data-close="assign-modal">إلغاء</button>
        </div>
      </form>
    </div>
  </div>
</body>

</html>
